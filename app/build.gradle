plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.autotest.BTControl'
    compileSdk 36

    signingConfigs {
        config {
            // 用仓库内自带的 key（已入库，alias=key0）。原来写死的 E:\Work\AS\key\BTControl.jks
            // 只在作者本机存在，别的机器 assembleDebug 会直接 Keystore file not found。
            storeFile file("../key/BTControl.jks")
            storePassword "123456"
            keyPassword "123456"
            keyAlias "key0"
        }
    }

    defaultConfig {
        applicationId "com.autotest.BTControl"
        minSdk 27
        targetSdk 36
        versionCode 2
        versionName "3.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.config
    }

    // 自定义打包名称
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def versionName = variant.versionName
            def apkName = "BTControl_v${versionName}.apk"
            outputFileName = apkName
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        disable 'Deprecation', 'ObsoleteSdkInt'
    }

//    tasks.withType(JavaCompile).configureEach {
//        options.compilerArgs += ['-Xlint:deprecation']
//    }

}

dependencies {

    // 保持当前依赖版本
    implementation libs.appcompat
    implementation libs.material
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.bluetooth
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}