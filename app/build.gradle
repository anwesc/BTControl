plugins {
    alias(libs.plugins.android.application)
}

// 版本号：默认取 gradle.properties 的 btcontrol.*，CI 打 tag 时用 -P 覆盖。
// versionCode 规则（CI 同步）：major*1000000 + minor*1000 + patch，3.2.0 → 3002000。
// 注意要在 android 块外用局部变量算好：AGP 9 的 DSL 在配置闭包里直接写
// `versionCode (expr)` 会被当成「调用同名闭包属性」而报 "Value is null"。
def btcontrolVersionName = (project.findProperty('btcontrol.versionName') ?: '3.2.0').toString()
def btcontrolVersionCode = (project.findProperty('btcontrol.versionCode') ?: '3002000').toString().toInteger()

android {
    namespace 'com.autotest.BTControl'
    compileSdk 36

    signingConfigs {
        config {
            // 用仓库内自带的 key（已入库，alias=key0）。原来写死的 E:\Work\AS\key\BTControl.jks
            // 只在作者本机存在，别的机器 assembleDebug 会直接 Keystore file not found。
            storeFile file("../key/BTControl.jks")
            storePassword "123456"
            keyPassword "123456"
            keyAlias "key0"
        }
    }

    defaultConfig {
        applicationId "com.autotest.BTControl"
        minSdk 27
        targetSdk 36
        // 版本号默认取 gradle.properties 的 btcontrol.*（见文件顶部），CI 用 -P 覆盖。
        versionCode = btcontrolVersionCode
        versionName = btcontrolVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.config
    }

    // 自定义打包名称
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def versionName = variant.versionName
            def apkName = "BTControl_v${versionName}.apk"
            outputFileName = apkName
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        disable 'Deprecation', 'ObsoleteSdkInt'
    }

//    tasks.withType(JavaCompile).configureEach {
//        options.compilerArgs += ['-Xlint:deprecation']
//    }

}

dependencies {

    // 保持当前依赖版本
    implementation libs.appcompat
    implementation libs.material
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.bluetooth
    // Shizuku：把 binder 调用借给 shell(uid 2000) 执行，用于绕开普通应用缺 MODIFY_PHONE_STATE 的 HFP 连接
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    // 隐藏 API 豁免：Android 16 的 BluetoothHeadset 把 IBluetoothHeadset 藏在 @hide 的
    // BluetoothProfileConnector 里，不豁免就反射不进去
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:4.3"
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}